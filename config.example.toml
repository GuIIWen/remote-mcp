# 配置模板：复制为 config.toml 后填写真实值。
# config.toml 本身已加入 .gitignore，不会被提交；这份模板里全是占位值，可以放心提交。

[bastion]
host = "bastion.example.com"   # 跳板机地址（域名或 IP）
port = 22
user = "yourname"              # 你在跳板机上的登录用户名
key  = ""                      # 私钥路径；留空则用默认密钥对（~/.ssh/id_*）
# 跳板机只支持密钥认证（配合 keyboard-interactive 做 TOTP），不要在这里写 password/address——
# 写了会在启动时被忽略并打印警告。

[daemon]
port            = 8765   # daemon 监听的本地端口，仅绑定 127.0.0.1
audit_log       = ""      # 留空则不记录；填绝对路径则写 JSONL 审计日志（不含密码）
connect_timeout = 20      # 跳板机 / 目标机建连超时（秒）

[hosts]
# 允许访问的目标机白名单，支持 fnmatch 通配符；留空表示不限制（生产环境建议显式配置）
allowed = ["dev1", "lab3", "lab4", "nmz01"]

# ── 跳板机路由节点（默认，via 可以省略） ──────────────────────────
[host.dev1]
user        = "yourname"                 # 该目标机上的登录用户名
default_cwd = "/home/yourname"    # 相对路径参数的解析基准（远端 Linux 路径）；各集群家目录不同，先在远端 echo $HOME 确认
# via = "bastion" 是默认值，省略即可；节点名 dev1 本身会作为主机名交给跳板机解析
# （即 yourname@dev1），认证只用密钥（key / cert，规则同下面的 direct+key 节点），
# 不支持也不接受 password。

# ── hop 路由节点：这台机器只有跳板机能免密登录，本机没有它的私钥 ─────
# 典型场景：计算节点（如 nmz01）只在跳板机的 authorized_keys 里加过本机公钥，
# 私钥则一直留在跳板机上，本机从没拿到过、也不需要拿到——这种节点没法用
# tunnel= 直连（那需要本机私钥能认证 nmz01），只能让跳板机自己代跑
# `ssh nmz01 '<命令>'`，daemon 在跳板机上执行这条命令，而不是在本机上转发端口。
[host.nmz01]
via         = "hop"
user        = "yourname"          # 可选：跳板机 ssh 到 nmz01 时用的 -l 用户名；
                                   # 留空则交给跳板机自己的 ~/.ssh/config 或 ssh 默认值决定
# port      = 22                  # 可选：跳板机 ssh 到 nmz01 时用的 -p 端口；同上，留空则用默认/~/.ssh/config
default_cwd = "/home/yourname"    # 远端 Linux 路径，语义和其它节点一致
# 部署前提（在跳板机上准备，不是在本机）：
#   1. nmz01 的私钥已经放在跳板机上，且跳板机能免密 ssh 到 nmz01——
#      这通常是跳板机侧已有的集群内网配置，本项目不负责生成或分发这把私钥。
#   2. 自检：登录跳板机后手动跑一次
#        ssh -o BatchMode=yes nmz01 hostname
#      能直接打印 nmz01 的 hostname、不弹密码/密钥口令提示，才说明这里能正常工作；
#      如果卡住或报错，先在跳板机上把这一步跑通，再回来用这个 daemon。
# hop 节点不支持 address/password/auth/key/cert——这些字段属于"daemon 直接连这台机器"
# 的场景，hop 节点从头到尾都是跳板机在连，填了会在启动时打印警告并被忽略。

# ── hop 路由 + docker 容器：命令在目标节点的容器里执行 ───────────────
# 段名（nmz01-ctr）是 MCP 里使用的节点名，也是 [hosts] allowed 匹配的名字；
# 跳板机实际 ssh 的目标由 node 决定，所以同一个 node 上可以有多个段对应不同容器。
[host.nmz01-ctr]
via            = "hop"
node           = "nmz01"          # 可选：跳板机实际 ssh 的目标；省略则等于段名
user           = "yourname"       # 仍然是跳板机 ssh 到 node 用的 -l（不是容器内用户）
container      = "mycontainer"    # 容器名或 ID 前缀；设了就用 docker exec -i 在容器里执行
                                   # 只允许字母、数字、. _ -（且不以 - 开头），否则启动报错
# container_user = "root"         # 可选：docker exec -u 的值；省略则不传 -u（用镜像默认用户）
default_cwd    = "/workspace/proj" # 注意：此时是【容器内】路径
# 前提：跳板机上的 ssh 用户能在 node 上直接运行 docker（无需 sudo），且容器里有 bash、
# coreutils（stat/readlink/base64/timeout）。container/node/container_user 只在 via="hop" 时有效，
# 其它路由配了会打印警告并被忽略。别忘了把 nmz01-ctr 加进上面 [hosts] allowed。

# ── 直连节点 + 密钥认证（可选 OpenSSH 用户证书） ───────────────────
[host.lab3]
via         = "direct"                      # 不经过跳板机，直接连 address:port
address     = "192.168.10.23"               # 必填：IP 或域名
port        = 2222                          # 默认 22
user        = "yourname"
auth        = "key"                         # key | password
key         = "C:/Users/<本机用户名>/.ssh/lab3_ed25519"   # 本机私钥路径；留空则依次回退到 [bastion] key、默认密钥对
cert        = ""                            # 可选：CA 签发的用户证书路径（*-cert.pub），配合 key 一起用
default_cwd = "/home/yourname"     # 远端 Linux 路径
# known_hosts = ""   # 可选：这台机器的 known_hosts 文件路径，用来校验 host key；
                     # 留空则不校验。direct 节点不在跳板机后面，建议至少给密码
                     # 认证的 direct 节点配这个字段。

# ── 直连节点 + 密码认证 ────────────────────────────────────────
[host.lab4]
via         = "direct"
address     = "192.168.10.24"
port        = 22
user        = "yourname"
auth        = "password"
password    = ""    # 明文写在本机 config.toml（已 gitignore）；留空则在 daemon 启动时用 getpass 交互输入
default_cwd = "/home/yourname"     # 远端 Linux 路径
# known_hosts = ""   # 同上，密码认证节点尤其建议配置
