# 配置模板：复制为 config.toml 后填写（也可以用应用里“配置 → 配置编辑”图形化编辑）。
# config.toml 已加入 .gitignore；这份模板全是占位值，可以放心提交。
# 所有节点在服务启动后都会主动连接；连不上的原因会打印在日志里并显示在状态面板中。

[bastion]
host = "bastion.example.com"
port = 22
user = "yourname"
# auth = "key"      # key（默认）：先试密钥，再走密码 / 验证码；password：不试任何密钥，只走密码 + 验证码
key  = ""            # 私钥路径；留空用默认密钥对（~/.ssh/id_*）
password = ""        # 可选：自动回答跳板机的“密码”提示；验证码仍弹窗/终端输入。留空则全部手动输入
# keepalive_interval  = 15   # 可选：SSH 保活间隔（秒），0 关闭
# keepalive_count_max = 8    # 可选：连续多少次保活无响应判定断线
# 有多台并列跳板机时，把 [bastion] 换成多张 [bastion.<名字>] 表（字段相同，如 [bastion.a]、[bastion.b]）；
# 此时每个 bastion / hop 节点必须用 bastion = "<名字>" 指定走哪一台，只有一台时可省略。

[daemon]
port            = 8765   # 本地监听端口（仅 127.0.0.1）；改后需重启服务
audit_log       = ""     # 留空不记录；填路径则写 JSONL 审计日志（不含密码）
connect_timeout = 20     # 目标机建连超时（秒）；跳板机 120 秒，auth="password" 的节点 60 秒（要留时间输验证码）
# heartbeat_interval = 60  # 可选：每隔多少秒在已有的跳板机连接上跑一次 `true` 防止空闲被踢，0 关闭

[hosts]
# 允许访问的节点白名单，匹配 [host.xxx] 的节点名（不是 IP），支持通配符；留空表示不限制
allowed = ["dev1", "dev2", "nmz01", "nmz01-ctr", "lab3", "lab4"]

# 通用字段：user 登录用户名；default_cwd 相对路径的基准（远端 Linux 路径，先在远端 echo $HOME 确认）。
# auth = "password" 的节点：密码自动回答，服务器多要的验证码（OTP）会弹窗输入。
# auth 不写就是 "key"，只发密钥，不支持验证码。

# ── 经跳板机的节点（via 默认就是 bastion）：本机私钥 + 跳板机隧道 ──────────
[host.dev1]
user        = "yourname"
default_cwd = "/home/yourname"
# bastion = "a"        # 多台跳板机时必填

# 跳板机解析不了节点名时（日志报 Temporary failure in name resolution），用 address / port 指定隧道目标；
# 目标机用密码（+ 验证码）登录时设 auth = "password"。
[host.dev2]
user        = "yourname"
address     = "10.0.0.12"
port        = 22
auth        = "password"
password    = ""     # 留空则启动时弹窗输入
default_cwd = "/home/yourname"

# ── hop 节点：只有跳板机能登录它，由跳板机执行 ssh <node> ───────────────
# 前提：跳板机上已能免密 ssh 到该节点（自检：在跳板机上跑 ssh -o BatchMode=yes <node> hostname）。
# 不支持密码 / 验证码；address / auth / key / cert / password 填了会被忽略。
[host.nmz01]
via         = "hop"
node        = "nmz01"      # 可选：跳板机实际 ssh 的目标（IP 或主机名），省略则等于节点名
user        = "yourname"   # 可选：跳板机 ssh 用的 -l
# port      = 22           # 可选：跳板机 ssh 用的 -p
default_cwd = "/home/yourname"

# hop + docker 容器：命令在目标节点的容器里执行（default_cwd 是容器内路径）
[host.nmz01-ctr]
via            = "hop"
node           = "nmz01"
user           = "yourname"
container      = "mycontainer"   # 容器名或 ID 前缀，只允许字母、数字、. _ -
# container_user = "root"        # 可选：docker exec -u
default_cwd    = "/workspace/proj"

# ── 直连节点：不经过跳板机，直接连 address:port ─────────────────────────
[host.lab3]
via         = "direct"
address     = "192.168.10.23"   # 必填
port        = 2222
user        = "yourname"
key         = "C:/Users/<本机用户名>/.ssh/lab3_ed25519"   # 留空依次回退到 [bastion] key、默认密钥对
# cert      = ""                # 可选：CA 签发的用户证书（*-cert.pub）
default_cwd = "/home/yourname"
# known_hosts = ""   # 可选：校验 host key 的 known_hosts 文件；留空不校验（密码认证节点建议配置）

[host.lab4]
via         = "direct"
address     = "192.168.10.24"
user        = "yourname"
auth        = "password"
password    = ""     # 明文只存本机 config.toml；留空则启动时弹窗输入
default_cwd = "/home/yourname"
